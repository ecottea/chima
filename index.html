<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- タイトルと説明文 -->
  <title>アナグラム／チマタグラムクイズ</title>
  <meta name="description" content="1文字余計な文字が入った並べ替えクイズ「チマタグラム」や「アナグラム」が遊べるWebサイトです。ポケモンの名前や技、ノンジャンル問題など多数収録！">
  <meta name="keywords" content="チマタグラム, アナグラム, クイズ, ポケモン, パズル">
  
  <!-- SNSシェア時の表示設定 (OGP) -->
  <meta property="og:title" content="チマタグラムクイズ">
  <meta property="og:description" content="余計な1文字が含まれた並べ替えクイズ「チマタグラム」に挑戦しよう！">
  <meta property="og:type" content="website">
  
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NDSGM2M26N"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-NDSGM2M26N');
  </script>

  <!-- モダンな日本語フォントを読み込み -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <!-- 外部CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow"><span></span> WORD PUZZLE STUDIO</p>
      <h1>アナグラム<span>／</span>チマタグラム</h1>
      <p class="hero-copy">ひらめきで文字をほどく、今日の一問。</p>
    </header>

  <!-- ルール説明エリア -->
    <aside class="rule-box">
      <span class="rule-icon">✦</span>
      <p>文字を並べ替えて、指定されたジャンルの言葉にしてください。<br>チマタグラムでは <strong>余計な文字が1文字</strong> 混ざっています。</p>
    </aside>

    <section class="control-panel" aria-label="出題設定">
      <div class="panel-heading"><span>PLAY SETTINGS</span><i></i></div>
    <div class="control-row">
      <label class="control-group">
        <span>問題セット</span>
        <select id="genreSelect">
          <option value="data/non_genre_anagram.json">ノンジャンル（アナグラム）</option>
          <option value="data/non_genre.json">ノンジャンル（チマタグラム）</option>
          <option value="data/pokemon_names.json">ポケモンの名前（チマタグラム）</option>
          <option value="data/pokemon_moves.json">ポケモンの技（チマタグラム）</option>
          <option value="data/pokemon_abilities.json">ポケモンの特性（チマタグラム）</option>
        </select>
      </label>
    </div>
    
    <div class="control-row control-row-number">
      <label class="control-group">
        <span>問題番号</span>
        <input type="number" id="problemInput" min="1">
      </label>
      <button id="goBtn" class="btn-secondary">移動</button>
      <button id="randomBtn" class="btn-accent">🎲 ランダム</button>
    </div>
    </section>

    <section class="card" aria-live="polite">
    <h3>
      <span id="problemNum">第 1 問</span>
      <span class="question-divider"></span>
      <span id="totalNum">全 0 問</span>
    </h3>
    
    <div class="question-block">
      <p><strong>ジャンル</strong> <span id="genreText">読み込み中...</span></p>
      <div class="q-text" id="questionText">読み込み中...</div>
      <p><strong>読み</strong> <span id="readingText">読み込み中...</span></p>
      <p id="remarksArea"><strong>備考</strong> <span id="remarksText">読み込み中...</span></p>
    </div>

    <button id="showAnswerBtn" class="btn-secondary answer-button" aria-controls="answerArea" aria-expanded="false">
      <span>💡</span> 答えを見る
    </button>

    <div id="answerArea" class="hidden">
      <p><strong>答え</strong> <span id="answerText" class="ans-highlight"></span></p>
      <p id="answerReadingArea"><strong>答えの読み</strong> <span id="answerReadingText" class="ans-highlight"></span></p>
      <p id="extraCharArea"><strong>余計な1文字</strong> <span id="extraCharText" class="ans-highlight"></span></p>
    </div>
    </section>

    <nav class="nav-area" aria-label="問題の移動">
    <button id="prevBtn" class="btn-primary btn-large">⬅ 前の問題へ</button>
    <button id="nextBtn" class="btn-primary btn-large">次の問題へ ➔</button>
    </nav>
  </main>

  <!-- 外部JavaScript -->
  <script src="script.js"></script>
</body>
</html>
