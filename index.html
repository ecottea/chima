<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アナグラム／チマタグラムクイズ</title>
  
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NDSGM2M26N"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-NDSGM2M26N');
  </script>

  <!-- モダンな日本語フォントを読み込み -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- 外部CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>✨ アナグラム／チマタグラムクイズ ✨</h2>

  <!-- ルール説明エリア -->
  <div class="rule-box">
    文字を並べ替えて指定されたジャンルの言葉にしてください。<br>
    ただしチマタグラムでは <strong>余計な文字が1文字</strong> 含まれています。
  </div>

  <div class="control-panel">
    <div class="control-row">
      <label class="control-group">
        問題セット:
        <select id="genreSelect">
          <option value="data/non_genre_anagram.json">ノンジャンル（アナグラム）</option>
          <option value="data/non_genre.json">ノンジャンル（チマタグラム）</option>
          <option value="data/pokemon_names.json">ポケモンの名前（チマタグラム）</option>
          <option value="data/pokemon_moves.json">ポケモンの技（チマタグラム）</option>
          <option value="data/pokemon_abilities.json">ポケモンの特性（チマタグラム）</option>
        </select>
      </label>
    </div>
    
    <div class="control-row" style="justify-content: flex-start;">
      <label class="control-group">
        問題番号:
        <input type="number" id="problemInput" min="1" style="width: 70px;">
      </label>
      <button id="goBtn" class="btn-secondary">移動</button>
      <button id="randomBtn" class="btn-accent">🎲 ランダム</button>
    </div>
  </div>

  <div class="card">
    <h3>
      <span id="problemNum">第 1 問</span> 
      <span style="color:#cbd5e1; margin:0 8px;">|</span> 
      <span id="totalNum">全 0 問</span>
    </h3>
    
    <div class="question-block">
      <p><strong>ジャンル</strong> <span id="genreText">読み込み中...</span></p>
      <div class="q-text" id="questionText">読み込み中...</div>
      <p><strong>読み</strong> <span id="readingText">読み込み中...</span></p>
      <p id="remarksArea"><strong>備考</strong> <span id="remarksText">読み込み中...</span></p>
    </div>

    <button id="showAnswerBtn" class="btn-secondary" style="width: 100%; padding: 14px; margin-top: 10px;">
      💡 答えを見る
    </button>

    <div id="answerArea" class="hidden">
      <p><strong>答え</strong> <span id="answerText" class="ans-highlight"></span></p>
      <p id="answerReadingArea"><strong>答えの読み</strong> <span id="answerReadingText" class="ans-highlight"></span></p>
      <p id="extraCharArea"><strong>余計な1文字</strong> <span id="extraCharText" class="ans-highlight"></span></p>
    </div>
  </div>

  <div class="nav-area" style="display: flex; justify-content: center; gap: 30px;">
    <button id="prevBtn" class="btn-primary btn-large">⬅ 前の問題へ</button>
    <button id="nextBtn" class="btn-primary btn-large">次の問題へ ➔</button>
  </div>

  <!-- 外部JavaScript -->
  <script src="script.js"></script>
</body>
</html>
